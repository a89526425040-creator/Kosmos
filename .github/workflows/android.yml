name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Godot and Android toolchain
        run: |
          godot --version
          test -n "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -x "$(command -v sdkmanager)"
          test -x "$(command -v java)"
          java -version
          sdkmanager --version

      - name: Install CI download utilities
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl unzip

      - name: Install required Android SDK packages
        run: |
          set -eu
          ANDROID_SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_SDK_DIR"
          mkdir -p "$ANDROID_SDK_DIR"
          yes | sdkmanager --sdk_root="$ANDROID_SDK_DIR" --licenses >/dev/null
          sdkmanager --sdk_root="$ANDROID_SDK_DIR" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"
          test -x "$ANDROID_SDK_DIR/platform-tools/adb"
          test -x "$ANDROID_SDK_DIR/build-tools/34.0.0/aapt"
          test -d "$ANDROID_SDK_DIR/platforms/android-34"
          test -d "$ANDROID_SDK_DIR/ndk/23.2.8568313"
          test -d "$ANDROID_SDK_DIR/cmake/3.10.2.4988404"

      - name: Install matching Godot Android export templates
        run: |
          set -eu
          VERSION="4.4.1.stable"
          ARCHIVE="/tmp/Godot_v4.4.1-stable_export_templates.tpz"
          DEST="$HOME/.local/share/godot/export_templates/$VERSION"
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            --output "$ARCHIVE"
          mkdir -p /tmp/godot-templates "$DEST"
          unzip -q "$ARCHIVE" -d /tmp/godot-templates
          DEBUG_TEMPLATE="$(find /tmp/godot-templates -type f -name android_debug.apk -print -quit)"
          RELEASE_TEMPLATE="$(find /tmp/godot-templates -type f -name android_release.apk -print -quit)"
          test -n "$DEBUG_TEMPLATE"
          test -n "$RELEASE_TEMPLATE"
          cp "$DEBUG_TEMPLATE" "$DEST/android_debug.apk"
          cp "$RELEASE_TEMPLATE" "$DEST/android_release.apk"
          printf '%s\n' "$VERSION" > "$DEST/version.txt"
          test -s "$DEST/android_debug.apk"
          test -s "$DEST/android_release.apk"

      - name: Configure Java, Android SDK and debug signing
        run: |
          set -eu
          JAVA_BIN="$(readlink -f "$(command -v java)")"
          JAVA_HOME_DIR="$(dirname "$(dirname "$JAVA_BIN")")"
          ANDROID_SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -x "$JAVA_HOME_DIR/bin/java"
          test -x "$ANDROID_SDK_DIR/platform-tools/adb"
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_DIR"
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          EOF
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
            echo "ANDROID_SDK_DIR=$ANDROID_SDK_DIR"
          } >> "$GITHUB_ENV"
          echo "Configured JAVA_HOME=$JAVA_HOME_DIR"
          echo "Configured ANDROID_HOME=$ANDROID_SDK_DIR"

      - name: Import project and validate scripts
        run: |
          set -eu
          LOG="$(mktemp)"
          if ! godot --headless --editor --path . --quit >"$LOG" 2>&1; then
            cat "$LOG"
            exit 1
          fi
          cat "$LOG"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|Compile Error:|Invalid call|Invalid assignment' "$LOG"; then
            echo "Godot reported script errors during project import."
            exit 1
          fi

      - name: Run headless startup smoke test
        run: |
          set -eu
          LOG="$(mktemp)"
          if ! godot --headless --path . --quit-after 3 >"$LOG" 2>&1; then
            cat "$LOG"
            exit 1
          fi
          cat "$LOG"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|Compile Error:|Invalid call|Invalid assignment' "$LOG"; then
            echo "Godot reported script errors during startup."
            exit 1
          fi

      - name: Verify Android export prerequisites
        run: |
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -s "$HOME/.android/debug.keystore"
          test -x "$ANDROID_SDK_DIR/platform-tools/adb"

      - name: Export Android debug APK
        run: |
          set -eu
          mkdir -p build
          LOG="$(mktemp)"
          if ! godot --headless --path . --export-debug "Android" build/Kosmos.apk >"$LOG" 2>&1; then
            cat "$LOG"
            exit 1
          fi
          cat "$LOG"
          if grep -Eq 'SCRIPT ERROR:|ERROR: Failed to load script|Parse Error:|Compile Error:|Invalid call|Invalid assignment|ERROR: Cannot export project|ERROR: Project export' "$LOG"; then
            echo "Godot reported script or export errors."
            exit 1
          fi
          test -s build/Kosmos.apk
          ls -lh build/Kosmos.apk
          sha256sum build/Kosmos.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kosmos-Android-APK
          path: build/Kosmos.apk
          if-no-files-found: error
          retention-days: 14
