name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare output
        run: mkdir -p build
      - name: Import project assets
        run: godot --headless --editor --path . --quit
      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" build/Kosmos.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kosmos-Android-APK
          path: build/Kosmos.apk
          if-no-files-found: error
          retention-days: 14
