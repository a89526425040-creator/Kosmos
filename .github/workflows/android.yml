name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Godot and Android toolchain
        run: |
          godot --version
          test -n "${ANDROID_HOME:-}"
          test -x "$(command -v sdkmanager)"
          test -x "$(command -v java)"
          java -version

      - name: Import project and validate scripts
        run: godot --headless --editor --path . --quit

      - name: Run headless startup smoke test
        run: godot --headless --path . --quit-after 3

      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/Kosmos.apk
          test -s build/Kosmos.apk
          file build/Kosmos.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kosmos-Android-APK
          path: build/Kosmos.apk
          if-no-files-found: error
          retention-days: 14
